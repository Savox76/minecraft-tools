<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITEL}}</title>
<meta name="description" content="{{BESCHREIBUNG}}">
<meta name="site-base" content="{{BASE}}">
<link rel="canonical" href="{{URL}}">
{{ALTERNATES}}
<meta name="robots" content="{{ROBOTS}}">
<meta property="og:site_name" content="Bauwerkstatt">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta property="og:locale:alternate" content="{{OG_LOCALE_ALT}}">
<meta property="og:type" content="{{OG_TYP}}">
<meta property="og:title" content="{{OG_TITEL}}">
<meta property="og:description" content="{{BESCHREIBUNG}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{BILD}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{BILD_ALT}}">
<meta name="twitter:card" content="summary_large_image">
{{VERIFIKATION}}
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{BASE}}favicon.svg" type="image/svg+xml">
<link rel="manifest" href="{{BASE}}manifest.webmanifest">
<link rel="sitemap" type="application/xml" href="{{BASE}}sitemap.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{BASE}}style.css?v={{V}}">
<script>try{var t=localStorage.getItem('bw.thema');if(t==='hell'||t==='dunkel')document.documentElement.dataset.theme=t==='hell'?'light':'dark'}catch(e){}</script>
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>
<a class="skip" href="#inhalt">{{TXT_SKIP}}</a>
<header class="kopf">
  <div class="kopf-innen">
    <a class="marke" href="{{START}}" aria-label="{{TXT_START}}">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M16 3 29 10.5v11L16 29 3 21.5v-11z" fill="var(--ink)"/><path d="M16 3 29 10.5 16 18 3 10.5z" fill="var(--hl)"/><path d="M16 18v11L3 21.5v-11z" fill="var(--ink-soft)"/></svg>
      <span class="marke-text"><b>Bauwerkstatt</b><small>{{TXT_ZUSATZ}}</small></span>
    </a>
    <nav class="nav" aria-label="Menu">{{NAV}}</nav>
    <div class="schalter">{{SPRACHE}}{{THEMA}}</div>
  </div>
</header>
<main id="inhalt" tabindex="-1">{{INHALT}}</main>
<footer class="fuss bauplan">
  <div class="fuss-innen">
    <div class="fuss-marke"><b>Bauwerkstatt</b><span>{{TXT_FUSS}}</span><a href="https://github.com/Savox76/minecraft-tools">{{TXT_GITHUB}}</a></div>
    <nav class="fuss-links" aria-label="{{TXT_ALLE_SEITEN}}">{{FUSS_LINKS}}</nav>
    <p class="klein">{{TXT_DISCLAIMER}}</p>
  </div>
</footer>
<script type="module" src="{{BASE}}js/app.js?v={{V}}"></script>
</body>
</html>
