# BossRaid – Einstellungen
# Nach Änderungen im Spiel: /raid neuladen  (geht nur, wenn kein Kampf läuft)

arena:
  # Fester Radius jeder Arena in Blöcken (Kreis um die Mitte). Wird nicht per Befehl gesetzt.
  radius: 30
  # Wie weit die Arena nach unten und oben reicht (ab der Mitte)
  hoehe-unten: 10
  hoehe-oben: 30

# Stufen: Faktoren für Leben, Schaden und Loot (Chancen und Mengen)
stufen:
  leicht: { leben: 0.6, schaden: 0.7, loot: 0.5 }
  normal: { leben: 1.0, schaden: 1.0, loot: 1.0 }
  schwer: { leben: 1.5, schaden: 1.3, loot: 2.0 }

# Ab dem zweiten Spieler: so viel mehr Leben pro weiterem Teilnehmer (0.4 = +40 %)
leben-pro-weiterem-spieler: 0.4

# Stirbt ein Spieler, heilt sich der Boss um diesen Anteil (0.10 = 10 %)
heilung-bei-spielertod: 0.10

loot:
  # Loot gibt es erst ab diesem Schadensanteil (0.05 = 5 %)
  mindest-anteil: 0.05

fernkampf:
  # Treffer mit Geschossen aus mehr als so vielen Blöcken zählen nur mit diesem Faktor
  entfernung: 30
  faktor: 0.5

unerreichbar:
  # Wer so viele Blöcke über dem Boss steht ...
  hoehe: 4
  # ... wird nach so vielen Sekunden heruntergezogen
  sekunden: 5

ritual:
  # Zeit zum Anzünden der vier Kerzen, nachdem der Gegenstand auf dem Altar liegt
  kerzen-zeit: 60
  # Dauer des Rituals, bis der Boss erscheint
  dauer: 10

# Admin-Start (/raid start): so lange kann man mit /raid beitreten mitmachen
sammeln-sekunden: 60
# Countdown, bevor der Boss erscheint
auftritt-sekunden: 5

fragmente:
  # Höchstens so viele Fragmente pro Spieler und Tag (bremst Monsterfarmen)
  tageslimit: 8

tod:
  # Bei der Regel "normal": so lange kann nur der Besitzer seine Sachen aufheben
  normal-besitzerschutz-minuten: 10
  # Gegenstände, deren Name einen dieser Texte enthält, werden nie abgenommen
  nie-abnehmen:
    - "Hilfe & Befehle"

# Spieler, die nie als Teilnehmer zählen (z. B. Namen von Farm-Bots)
ignorierte-spieler: []
# NPCs anderer Plugins (mit Markierung "NPC") nie als Teilnehmer zählen
npc-ignorieren: true

# Höchste echte Lebenspunkte eines Boss-Wesens. Mehr Leben rechnet das Plugin intern um.
max-lebenspunkte-wesen: 1000
