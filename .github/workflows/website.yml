name: Website

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'   # täglich: Wunschliste aktualisieren
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Pakete und Schrift für Vorschaubilder
        run: |
          pip install -r tools/requirements.txt
          fc-list | grep -q DejaVuSans-Bold || (sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core)
      - name: Labels für Wünsche anlegen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create bauwunsch --color f4b400 --description "Wunsch nach einem neuen Bauplan" 2>/dev/null || true
          gh label create plugin-wunsch --color 4a5866 --description "Wunsch nach einem Plugin oder einer Funktion" 2>/dev/null || true
          gh label create fehler --color d73a4a --description "Etwas funktioniert nicht" 2>/dev/null || true
          gh label create angenommen --color 2f8f4e --description "Wird umgesetzt" 2>/dev/null || true
      - name: Wünsche holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch_wishes.py
      - name: Website und Downloads erzeugen
        run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  veroeffentlichen:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Suchmaschinen über neue Seiten informieren (IndexNow für Bing, Yandex, Seznam u. a.)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SEITE: ${{ steps.deploy.outputs.page_url }}
        run: |
          KEY=$(curl -fsS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/tools/site_config.json" | python3 -c "import json,sys;print(json.load(sys.stdin)['indexnow_key'])")
          sleep 20
          curl -fsS "${SEITE}urls.txt" -o urls.txt
          HOST=$(python3 -c "from urllib.parse import urlparse;print(urlparse('${SEITE}').netloc)")
          python3 - <<PY
          import json
          urls = [u.strip() for u in open('urls.txt') if u.strip()]
          json.dump({'host': '$HOST', 'key': '$KEY', 'keyLocation': '${SEITE}$KEY.txt', 'urlList': urls}, open('indexnow.json', 'w'))
          print(len(urls), 'Adressen')
          PY
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow.json https://api.indexnow.org/indexnow
