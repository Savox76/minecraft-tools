name: Plugins

# Baut die eigenen Plugins mit eigenem Gradle-Build (plugins/eigene/<id>/build.gradle.kts).
# Ein Tag <id>-v<version> (z. B. bossraid-v0.1.0) baut nur dieses Plugin und hängt die .jar an ein Release.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/eigene/*/src/**'
      - 'plugins/eigene/*/build.gradle.kts'
      - 'plugins/eigene/*/settings.gradle.kts'
      - '.github/workflows/plugins.yml'
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      klassenpfad:
        description: 'Bibliotheken als Entwurfs-Release ablegen (nur für die Prüfung beim Entwickeln)'
        type: boolean
        default: false
      release:
        description: 'Plugin-ID (z. B. bossraid): Release <id>-v<version> mit der .jar anlegen'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Plugins bauen
        run: |
          set -e
          for d in plugins/eigene/*/; do
            [ -f "$d/build.gradle.kts" ] || continue
            id=$(basename "$d")
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              tag="${GITHUB_REF#refs/tags/}"
              [ "$id" = "${tag%-v*}" ] || continue
            fi
            echo "::group::$id"
            (cd "$d" && gradle --no-daemon --console=plain build)
            echo "::endgroup::"
            ls -l "$d/build/libs"
          done
      - name: Testserver (Paper startet mit den Plugins)
        run: |
          set -e
          mkdir -p testserver/plugins && cd testserver
          ver=1.21.4
          url=$(curl -fsSL "https://fill.papermc.io/v3/projects/paper/versions/$ver/builds/latest" | jq -r '.downloads."server:default".url' || true)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            b=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/$ver/builds" | jq -r '.builds[-1].build')
            url="https://api.papermc.io/v2/projects/paper/versions/$ver/builds/$b/downloads/paper-$ver-$b.jar"
          fi
          curl -fsSL -o paper.jar "$url"
          cp ../plugins/eigene/*/build/libs/*.jar plugins/ 2>/dev/null || true
          ls plugins
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\n' > server.properties
          mkfifo eingabe
          (sleep 600; echo stop) > eingabe &
          java -Xmx1500M -jar paper.jar --nogui < eingabe > log.txt 2>&1 &
          exec 3> eingabe
          for i in $(seq 1 240); do grep -q 'Done (' log.txt && break; sleep 1; done
          for c in "raid" "raid bosse" "raid rezepte" "raid liste" "bossarena liste" "raid gegenstand seelenkristall"; do echo "$c" >&3; sleep 1; done
          echo "stop" >&3
          for i in $(seq 1 60); do grep -q 'Closing Server\|Stopping server' log.txt && sleep 5 && break; sleep 1; done
          exec 3>&-
          sed -n '/Loading/,$p' log.txt | grep -iE 'bossraid|error|exception|warn' | head -80 || true
          if grep -qiE 'Error occurred while enabling|Could not load .*plugins|Exception.*de\.savox|de\.savox.*Exception' log.txt; then
            echo "::error::Ein Plugin hat beim Start einen Fehler gemeldet"; grep -iE -A15 'Error occurred|de\.savox' log.txt | head -120; exit 1
          fi
          grep -q 'BossRaid bereit' log.txt || { echo "::error::BossRaid wurde nicht gestartet"; tail -80 log.txt; exit 1; }
      - name: Release mit .jar
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          id="${tag%-v*}"
          gh release create "$tag" plugins/eigene/$id/build/libs/*.jar --title "$tag" \
            --notes "Fertige Plugin-Datei. In den Ordner plugins des Servers legen und den Server neu starten. Anleitung: plugins/eigene/$id/README.md"
      - name: Release per Knopfdruck
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.release }}
        run: |
          ver=$(grep -oP '^version = "\K[^"]+' "plugins/eigene/$ID/build.gradle.kts")
          tag="$ID-v$ver"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag gibt es schon, die .jar wird ersetzt."
            gh release upload "$tag" plugins/eigene/$ID/build/libs/*.jar --clobber
          else
            gh release create "$tag" plugins/eigene/$ID/build/libs/*.jar --target "$GITHUB_SHA" --title "$tag" \
              --notes "Fertige Plugin-Datei. In den Ordner plugins des Servers legen und den Server neu starten. Anleitung: plugins/eigene/$ID/README.md"
          fi
      - name: Bibliotheken für die Prüfung ablegen
        if: github.event_name == 'workflow_dispatch' && inputs.klassenpfad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd plugins/eigene/bossraid
          gradle --no-daemon -q klassenpfad
          (cd build && zip -qr klassenpfad.zip klassenpfad)
          gh release delete werkzeug-klassenpfad -y --cleanup-tag 2>/dev/null || true
          gh release create werkzeug-klassenpfad build/klassenpfad.zip --draft \
            --title "Werkzeug: Bibliotheken (Entwurf, nicht veröffentlichen)" --notes "Nur für die Prüfung beim Entwickeln."
